<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HoReCaLog</title>

    <link
        rel="stylesheet"
        href="style.css?v=11"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-180.png"
    >

</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <h1>

            <span class="app-logo">
                🍽
            </span>

            HorecaLog

        </h1>

    </header>



    <!-- =====================================================
         RESTAURANTS
         ===================================================== -->

    <section id="restaurantsPage">


        <button
            class="primair"
            onclick="nieuwRestaurant()"
            data-i18n="nieuweHorecazaak"
        >
            ➕ Nieuwe horecazaak
        </button>


        <div
            id="nieuwRestaurantForm"
            class="card hidden"
        >

            <h2 data-i18n="nieuweHorecazaakTitel">
                Nieuwe horecazaak
            </h2>


            <input
                id="naam"
                placeholder="Naam horecazaak"
                data-i18n-placeholder="naamHorecazaak"
            >


            <input
                id="gemeente"
                placeholder="Gemeente"
                data-i18n-placeholder="gemeente"
            >


            <label data-i18n="typeKeuken">
                Type keuken
            </label>


            <select
                id="keukenSelect"
                onchange="keukenGewijzigd()"
            >

                <option
                    value=""
                    data-i18n="kiesKeuken"
                >
                    Kies keuken...
                </option>

                <option
                    value="Belgisch"
                    data-i18n="belgisch"
                >
                    Belgisch
                </option>

                <option
                    value="Café"
                    data-i18n="cafe"
                >
                    Café
                </option>

                <option
                    value="Italiaans"
                    data-i18n="italiaans"
                >
                    Italiaans
                </option>

                <option
                    value="Grieks"
                    data-i18n="grieks"
                >
                    Grieks
                </option>

                <option
                    value="Spaans"
                    data-i18n="spaans"
                >
                    Spaans
                </option>

                <option
                    value="Aziatisch"
                    data-i18n="aziatisch"
                >
                    Aziatisch
                </option>

                <option
                    value="Japans"
                    data-i18n="japans"
                >
                    Japans
                </option>

                <option
                    value="Chinees"
                    data-i18n="chinees"
                >
                    Chinees
                </option>

                <option
                    value="Thais"
                    data-i18n="thais"
                >
                    Thais
                </option>

                <option
                    value="Andere"
                    data-i18n="andere"
                >
                    Andere...
                </option>

            </select>


            <input
                id="andereKeuken"
                placeholder="Andere keuken"
                data-i18n-placeholder="andereKeuken"
                class="hidden"
            >


            <button
                class="primair"
                onclick="opslaan()"
                data-i18n="opslaan"
            >
                💾 Opslaan
            </button>

        </div>



        <h2 data-i18n="mijnHorecazaken">
            Mijn horecazaken
        </h2>


        <input
            type="search"
            id="zoekRestaurant"
            placeholder="🔍 Zoek horecazaak of gemeente..."
            data-i18n-placeholder="zoekHorecazaak"
            oninput="toonRestaurants()"
        >


        <div id="lijst"></div>


        <!-- Verborgen horecazaken -->

<button
    id="verborgenRestaurantsKnop"
    class="verborgen-lijst-knop"
    onclick="toonVerborgenRestaurants()"
>
    👁️ <span data-i18n="verborgenHorecazaken">
        Verborgen horecazaken
    </span>
</button>


    </section>



    <!-- =====================================================
         DETAIL RESTAURANT
         ===================================================== -->

    <section
        id="detailPage"
        class="hidden"
    >


        <button
            onclick="terugNaarLijst()"
            data-i18n="terug"
        >
            ← Terug
        </button>



        <div class="detail-card">


            <!-- NAAM -->

            <h1 id="detailNaam"></h1>


            <!-- GEMEENTE -->

            <p id="detailGemeente"></p>


            <!-- KEUKEN -->

            <p
                id="detailKeuken"
                class="detail-keuken"
            ></p>



            <!-- =================================================
                 FOTO'S RESTAURANT
                 ================================================= -->

            <h3 data-i18n="fotosVanDeZaak">
                📷 Foto's van de zaak
            </h3>


            <label
                for="restaurantFotoInput"
                class="foto-toevoegen"
                data-i18n="fotoToevoegen"
            >
                📷 Foto toevoegen
            </label>


            <input
                type="file"
                id="restaurantFotoInput"
                accept="image/*"
                multiple
                onchange="restaurantFotosToevoegen(event)"
                hidden
            >


            <div
                id="restaurantFotos"
                class="foto-grid"
            ></div>



            <!-- =================================================
                 BEZOEK TOEVOEGEN
                 ================================================= -->

            <button
                class="primair"
                onclick="nieuwBezoek()"
                data-i18n="nieuwBezoek"
            >
                ➕ Nieuw bezoek
            </button>



            <!-- =================================================
                 FORMULIER BEZOEK
                 ================================================= -->

            <div
                id="nieuwBezoekForm"
                class="hidden"
            >


                <h3 data-i18n="nieuwBezoek">
                    ➕ Nieuw bezoek
                </h3>


                <label data-i18n="datum">
                    Datum
                </label>


                <input
                    type="date"
                    id="bezoekDatum"
                >



<label data-i18n="score">
    Score
</label>

<div
    id="scoreSterren"
    class="score-sterren"
>

    <button
        type="button"
        class="score-ster"
        data-score="1"
        onclick="scoreSterKiezen(1)"
    >☆</button>

    <button
        type="button"
        class="score-ster"
        data-score="2"
        onclick="scoreSterKiezen(2)"
    >☆</button>

    <button
        type="button"
        class="score-ster"
        data-score="3"
        onclick="scoreSterKiezen(3)"
    >☆</button>

    <button
        type="button"
        class="score-ster"
        data-score="4"
        onclick="scoreSterKiezen(4)"
    >☆</button>

    <button
        type="button"
        class="score-ster"
        data-score="5"
        onclick="scoreSterKiezen(5)"
    >☆</button>

    <button
        type="button"
        class="score-half"
        onclick="halveSterToevoegen()"
    >½</button>

</div>

<input
    type="hidden"
    id="bezoekScore"
    value="0"
>



                <label data-i18n="opmerking">
                    Opmerking
                </label>


                <textarea
                    id="bezoekOpmerking"
                    rows="5"
                ></textarea>



                <!-- FOTO KNOP BEZOEK -->

                <div
                    id="bezoekFotoKnop"
                    class="hidden"
                >

                    <label
                        for="fotoBezoekInput"
                        class="foto-toevoegen"
                        data-i18n="fotoToevoegen"
                    >
                        📷 Foto toevoegen
                    </label>


                    <input
                        type="file"
                        id="fotoBezoekInput"
                        accept="image/*"
                        multiple
                        onchange="bezoekFotosToevoegen(event)"
                        hidden
                    >

                </div>



                <button
                    onclick="bezoekOpslaanNieuw()"
                    data-i18n="opslaan"
                >
                    💾 Opslaan
                </button>


            </div>



            <!-- =================================================
                 BEZOEKEN
                 ================================================= -->

            <hr>


            <div id="bezoekenLijst"></div>



            <!-- =================================================
                 EXTRA OPTIES
                 ================================================= -->

<details class="meer-opties">

    <summary data-i18n="meerOpties">
        ⚙️ Meer opties
    </summary>

    <div class="meer-opties-inhoud">


        <!-- Favoriet -->

        <button
            id="favorietKnop"
            onclick="favorietWisselen()"
        >
        </button>


        <!-- Verbergen -->

        <button
            id="verborgenKnop"
            onclick="verborgenWisselen()"
        >
        </button>


        <!-- Google Maps -->

        <button onclick="openGoogleMaps()">

            <span data-i18n="googleMaps">
                📍 Open in Google Maps
            </span>

        </button>


        <!-- Locatie instellen -->

        <button onclick="locatieInstellen()">

            <span data-i18n="locatieInstellen">
                🗺️ Locatie instellen
            </span>

        </button>


        <!-- Bewerken -->

        <button onclick="bewerken()">

            <span data-i18n="horecazaakBewerken">
                ✏️ Horecazaak bewerken
            </span>

        </button>


        <!-- Verwijderen -->

        <button
            class="verwijder-restaurant"
            onclick="verwijderen()"
        >

            <span data-i18n="horecazaakVerwijderen">
                🗑️ Horecazaak verwijderen
            </span>

        </button>


    </div>

</details>

        </div>


    </section>



    <!-- =====================================================
         FAVORIETEN
         ===================================================== -->

    <section
        id="favorietenPage"
        class="hidden"
    >

        <h2 data-i18n="favorieten">
            ❤️ Favorieten
        </h2>


        <div id="favorietenLijst"></div>

    </section>



    <!-- =====================================================
         KAART
         ===================================================== -->

    <section
        id="kaartPage"
        class="hidden"
    >

        <div id="map"></div>

    </section>



   <!-- =====================================================
     IDEEËN
     ===================================================== -->

<section
    id="ideeenPage"
    class="hidden"
>


    <div class="ideeen-header">

        <h2 data-i18n="ideeen">
            💡 Ideeën
        </h2>


        <p data-i18n="ideeUitleg">
            Noteer hier snel iets dat je later
            aan HorecaLog wilt verbeteren.
        </p>

    </div>



    <div class="idee-nieuw">


        <textarea
            id="ideeTekst"
            rows="3"
            data-i18n-placeholder="ideePlaceholder"
            placeholder="Wat wil je aanpassen of toevoegen?"
        ></textarea>


        <button
            onclick="ideeOpslaanViaForm()"
            data-i18n="ideeOpslaan"
        >
            💾 Idee opslaan
        </button>


    </div>



    <h3 data-i18n="mijnIdeeen">
        Mijn ideeën
    </h3>


    <div id="ideeenLijst"></div>


</section>



<!-- =====================================================
     INSTELLINGEN
     ===================================================== -->

<section
    id="instellingenPage"
    class="hidden"
>

    <h2 data-i18n="instellingen">
        ⚙ Instellingen
    </h2>


    <!-- TAAL -->

    <h3 data-i18n="taal">
        🌐 Taal
    </h3>


    <select
        id="taalSelect"
        onchange="taalInstellen(this.value)"
    >

        <option value="nl">
            Nederlands
        </option>

        <option value="en">
            English
        </option>

        <option value="fr">
            Français
        </option>

    </select>


    <!-- BACKUP -->

    <button
        onclick="backupMaken()"
        data-i18n="maakBackup"
    >
        ☁ Maak back-up
    </button>


    <input
        type="file"
        id="backupInput"
        accept=".json"
        hidden
    >


    <button
        onclick="document.getElementById('backupInput').click()"
        data-i18n="herstelBackup"
    >
        ⬇ Herstel back-up
    </button>


    <button
        data-i18n="exporteerGegevens"
    >
        📤 Exporteer gegevens
    </button>


    <button
        onclick="allesWissen()"
        data-i18n="allesWissen"
    >
        🗑 Alles wissen (test)
    </button>


</section>


</div>



<!-- =====================================================
     FOTO MODAL
     ===================================================== -->

<div
    id="fotoModal"
    class="foto-modal hidden"
>


    <button
        class="foto-modal-sluiten"
        onclick="sluitGroteFoto()"
        aria-label="Sluiten"
    >
        ✕
    </button>



    <img
        id="groteFoto"
        src=""
        alt="Vergrote foto"
    >


</div>



<!-- =====================================================
     SCRIPTS
     ===================================================== -->

<script src="js/database.js?v=11"></script>

<script src="js/i18n.js?v=11"></script>

<script src="js/ui.js?v=11"></script>

<script src="js/restaurants.js?v=11"></script>

<script src="js/bezoeken.js?v=11"></script>

<script src="js/backup.js?v=11"></script>

<script src="js/ideeen.js?v=11"></script>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script src="js/kaart.js?v=11"></script>

<script src="js/app.js?v=11"></script>



<!-- =====================================================
     ONDERSTE NAVIGATIE
     ===================================================== -->

<nav class="bottom-nav">


    <button onclick="toonPagina('restaurantsPage')">

        🍽

        <span data-i18n="horeca">
            Horeca
        </span>

    </button>



    <button onclick="toonPagina('favorietenPage')">

        ❤️

        <span data-i18n="favorieten">
            Favorieten
        </span>

    </button>



    <button onclick="toonPagina('kaartPage')">

        🗺

        <span data-i18n="kaart">
            Kaart
        </span>

    </button>



    <button onclick="toonPagina('ideeenPage')">

        💡

        <span data-i18n="ideeen">
            Ideeën
        </span>

    </button>



    <button onclick="toonPagina('instellingenPage')">

        ⚙

        <span data-i18n="instellingen">
            Instellingen
        </span>

    </button>


</nav>


<script>
    /*
       Vertalingen toepassen zodra de pagina geladen is.
    */

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            vertalingenToepassen();

        }
    );
</script>


</body>

</html>
