<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantLog</title>
    <link rel="stylesheet" href="style.css">
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
    <link rel="manifest" href="manifest.json">
</head>

<body>

<div class="app">

    <header>
        <h1>🍽 RestaurantLog</h1>
    </header>


    <!-- RESTAURANTS -->
    <section id="restaurantsPage">

        <button onclick="nieuwRestaurant()">
    ➕ Nieuw restaurant
</button>


<div id="nieuwRestaurantForm"
     class="card hidden">

    <h2>Nieuw restaurant</h2>

    <input id="naam" placeholder="Naam restaurant">

    <input id="gemeente" placeholder="Gemeente">

    <label>
    Type keuken
</label>

<select id="keukenSelect"
        onchange="keukenGewijzigd()">

    <option value="">
        Kies keuken...
    </option>

    <option value="Belgisch">
        Belgisch
    </option>

    <option value="Café">
        Café
    </option>

    <option value="Italiaans">
        Italiaans
    </option>

    <option value="Grieks">
        Grieks
    </option>

    <option value="Spaans">
        Spaans
    </option>

    <option value="Aziatisch">
        Aziatisch
    </option>

    <option value="Japans">
        Japans
    </option>

    <option value="Chinees">
        Chinees
    </option>

    <option value="Thais">
        Thais
    </option>

    <option value="Andere">
        Andere...
    </option>

</select>


<input id="andereKeuken"
       placeholder="Andere keuken"
       class="hidden">


    <button onclick="opslaan()">
        💾 Opslaan
    </button>

</div>


        <h2>Mijn restaurants</h2>

        <div id="lijst"></div>

    </section>

<!-- DETAIL RESTAURANT -->

<section id="detailPage" class="hidden">

    <button onclick="terugNaarLijst()">
        ← Terug
    </button>


    <div class="detail-card">


        <h1 id="detailNaam"></h1>

        <p id="detailGemeente"></p>

        <p id="detailKeuken"
   class="detail-keuken"></p>

    <button 
            id="favorietKnop"
            onclick="favorietWisselen()">
        </button>

        <button onclick="openGoogleMaps()">
    📍      Open in Google Maps
        </button>

        <button onclick="locatieInstellen()">
    🗺️ Locatie instellen
        </button>

        <button onclick="nieuwBezoek()">
    ➕      Nieuw bezoek
        </button>

<div id="nieuwBezoekForm"
     class="hidden">


    <h3>
        ➕ Nieuw bezoek
    </h3>


    <label>
        Datum
    </label>

    <input 
        type="date"
        id="bezoekDatum"
    >

    <label>
        Score
    </label>

    <select id="bezoekScore">

        <option value="1">⭐</option>
        <option value="2">⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="5">⭐⭐⭐⭐⭐</option>

    </select>


    <label>
        Opmerking
    </label>

    <textarea
        id="bezoekOpmerking"
        rows="5">
    </textarea>


    <button onclick="bezoekOpslaanNieuw()">
        💾 Opslaan
    </button>

</div>

<hr>

        <div id="bezoekenLijst"></div>
<button
    class="verwijder-restaurant"
    onclick="verwijderen()"
>
    🗑️ Restaurant verwijderen
</button>

    </div>

</section>

    <!-- FAVORIETEN -->
<section id="favorietenPage" class="hidden">

    <h2>❤️ Favorieten</h2>

    <div id="favorietenLijst"></div>

</section>

<section id="kaartPage" class="hidden">

    <div id="map"></div>

</section>

<section id="ideeenPage" class="hidden">

    <div class="ideeen-header">

        <h2>💡 Ideeën</h2>

        <p>
            Noteer hier snel iets dat je later
            aan RestaurantLog wilt verbeteren.
        </p>

    </div>


    <div class="idee-nieuw">

        <textarea
            id="ideeTekst"
            rows="3"
            placeholder="Wat wil je aanpassen of toevoegen?"
        ></textarea>


        <button onclick="ideeOpslaanViaForm()">
            💾 Idee opslaan
        </button>

    </div>


    <h3>
        Mijn ideeën
    </h3>


    <div id="ideeenLijst"></div>

</section>


    <!-- INSTELLINGEN -->
    <section id="instellingenPage" class="hidden">

        <h2>⚙ Instellingen</h2>


        <button onclick="backupMaken()">
            ☁ Maak iCloud back-up
        </button>


        <input 
    type="file" 
    id="backupInput"
    accept=".json"
    hidden
>

<button onclick="document.getElementById('backupInput').click()">
    ⬇ Herstel back-up
</button>


        <button>
            📤 Exporteer gegevens
        </button>


<button onclick="allesWissen()">
    🗑 Alles wissen (test)
</button>

    </section>

</div>



<!-- NAVIGATIE -->

<script src="js/database.js"></script>
<script src="js/ui.js"></script>
<script src="js/restaurants.js"></script>
<script src="js/bezoeken.js"></script>
<script src="js/backup.js"></script>
<script src="js/ideeen.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/kaart.js"></script>
<script src="js/app.js"></script>

<nav class="bottom-nav">

    <button onclick="toonPagina('restaurantsPage')">
        🍽
        <span>Restaurants</span>
    </button>


    <button onclick="toonPagina('favorietenPage')">
        ❤️
        <span>Favorieten</span>
    </button>


    <button onclick="toonPagina('kaartPage')">
        🗺
        <span>Kaart</span>
    </button>


    <button onclick="toonPagina('ideeenPage')">
        💡
        <span>Ideeën</span>
    </button>


    <button onclick="toonPagina('instellingenPage')">
        ⚙
        <span>Instellingen</span>
    </button>

</nav>

</body>
</html>
